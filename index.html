<style>

.public{min-height:100vh;background:linear-gradient(110deg,#0c72ef,#0750ab 55%,#05295f);color:#fff;display:grid;place-items:center;padding:30px}.hero{width:min(1050px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}.hero h1{font-size:58px;line-height:1;margin:8px 0 16px;letter-spacing:-2px}.hero p{color:#deebff;line-height:1.7}.hero-card{background:#fff;color:#111;border-radius:14px;padding:25px;box-shadow:0 25px 70px #001a4735}.hero-card .btn{width:100%;margin:5px 0}.auth{min-height:100vh;background:var(--bg);display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:12px;font-weight:800}.form input,.form textarea,.form select{width:100%;padding:10px;border:1px solid #d8dde5;border-radius:7px}.form textarea{min-height:110px}.msg{font-size:12px;min-height:18px}
.portal{min-height:100vh;background:#f5f5f6}.top{height:55px;background:#fff;border-bottom:1px solid #e7e9ed;display:grid;grid-template-columns:220px 1fr 220px;align-items:center;padding:0 18px;position:sticky;top:0;z-index:40}.top .mid{text-align:center}.top .mid small{display:block;font-size:8px;color:var(--mut)}.user{text-align:right;font-size:12px}.layout{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 55px)}.side{background:#fff;border-right:1px solid #e5e7eb;padding:15px 10px;display:flex;flex-direction:column;gap:4px}.side button,.side a{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:7px;font-size:12px}.side button:hover,.side button.on{background:#dce8ff;color:#075ed0}.main{min-width:0}.home-hero{background:linear-gradient(110deg,#0b72ef,#084fa7 55%,#062b65);color:#fff;padding:45px 6%;min-height:255px;display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center}.home-hero h1{font-size:36px;font-weight:400;margin:7px 0}.home-hero p{font-size:12px;color:#dbe9ff}.mural h2{font-size:16px;border-bottom:1px solid #ffffff55;padding-bottom:9px}.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.notice{background:#ffffff20;padding:14px;border-radius:7px}.notice:first-child{background:#fff;color:#111}.notice:first-child p{color:#555}.notice h3{font-size:13px}.notice p{font-size:10px;color:#e6efff}.sec{padding:28px 5%}.sec-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:15px}.sec-head h2{margin:0;font-size:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.continue{background:#0b72ec;color:#fff;border-radius:7px;padding:17px 19px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.continue small{font-size:9px}.continue h3{margin:5px 0;font-size:15px}.round{width:35px;height:35px;border-radius:50%;border:0;background:#fff;color:var(--b);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;min-height:180px}.card small{font-size:9px;color:#596171}.card h3{font-size:17px;line-height:1.2;margin:7px 0}.card p{font-size:11px;line-height:1.55;flex:1;color:var(--mut)}.card button{border:0;border-radius:5px;padding:9px;background:#075fcf;color:#fff;font-size:11px;font-weight:800}
.course{min-height:100vh;background:#f2f2f3}.ctop{height:52px;background:#fff;border-bottom:1px solid #e5e7eb;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;position:sticky;top:0;z-index:50}.ctop button{border:0;background:transparent;color:#075fd1;font-size:11px}.ctop .center{text-align:center}.ctop .right{text-align:right;font-size:11px}.cbody{padding:48px max(16px,calc((100% - 1420px)/2))}.cbody>h1{font-size:25px}.stats{background:#fff;border:1px solid var(--line);border-radius:7px;padding:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px}.stats div{padding:0 12px;border-right:1px solid #e6e8eb}.stats div:last-child{border:0}.stats b{display:block;font-size:16px}.stats span{font-size:10px;color:var(--mut)}.intro{background:#fff;border:1px solid var(--line);border-radius:7px;padding:25px;margin-bottom:20px}.k{font-size:9px;color:#075fd1;font-weight:900;letter-spacing:.05em}.intro ol{display:grid;gap:10px}.intro li b{display:block;font-size:13px}.intro li span{display:block;font-size:11px;color:var(--mut);margin-top:3px}.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.topic{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px}.topic h3{font-size:18px;margin:7px 0}.topic p{font-size:11px;color:var(--mut);min-height:52px}.topic-meta{border-top:1px solid #eceef0;padding-top:10px;display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}.topic button{width:100%;border:0;border-radius:5px;background:#075fcf;color:#fff;padding:9px;font-weight:800;margin-top:12px}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.res{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px;cursor:pointer}.res strong{display:block;margin:7px 0}.res span{font-size:10px;color:var(--mut)}
.lesson{min-height:100vh;background:#f1f1f2}.lbar{height:52px;background:#fff;border-bottom:1px solid #e6e8eb;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 27px;position:sticky;top:0;z-index:60}.lbar button{border:0;background:transparent;color:#075fd1;font-size:11px}.lbar .t{text-align:center;font-size:10px}.complete{text-align:right}.lhead{background:#062c72;color:#fff;padding:35px max(20px,calc((100% - 850px)/2));font-size:26px;font-weight:850}.paper{width:min(850px,calc(100% - 28px));margin:auto;background:#fff;border-left:1px solid #dddfe3;border-right:1px solid #dddfe3;padding:42px 56px 60px}.paper h2{font-size:21px;margin:28px 0 12px}.paper p,.paper li{font-size:13px;line-height:1.9;color:#303744}.objectives{border:1px solid #e1e3e6;border-radius:5px;padding:22px;margin-bottom:28px}.study{padding:12px 0 25px;border-bottom:1px solid #eceef0}.call{border-left:4px solid #0b67da;background:#e9f4ff;padding:17px 18px;margin:24px 0}.call.green{background:#e8f8ef;border-color:#11965d}.summary{background:#f7f8fa;border:1px solid #e2e5e9;padding:18px;border-radius:5px}.refs{border-top:1px solid #e5e7eb;margin-top:30px;padding-top:20px;font-size:10px;color:var(--mut)}
.map{background:#fff;border:1px solid var(--line);border-radius:7px;padding:24px;margin-top:25px}.map h2{text-align:center}.mind{display:grid;grid-template-columns:1fr 190px 1fr;gap:14px;align-items:center}.center-node{aspect-ratio:1;border-radius:50%;background:#075fcf;color:#fff;display:grid;place-content:center;text-align:center;padding:16px;font-weight:900}.col{display:grid;gap:10px}.node{border:1px solid #d9dde4;border-radius:7px;padding:12px;background:#fff}.node h4{font-size:11px;color:#075fcf;margin:0 0 6px}.node li{font-size:9px;line-height:1.5;color:#586171}.question{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px;margin-bottom:11px}.flashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.flash{background:#fff;border:1px solid var(--line);border-radius:7px;padding:17px;min-height:145px}.flash b{color:#075fcf}.flash div{border-top:1px solid #eee;margin-top:12px;padding-top:12px;font-size:12px;line-height:1.6}.rbody{width:min(1100px,calc(100% - 30px));margin:auto;padding:34px 0 70px}
.admin{min-height:100vh;background:#f3f4f6;padding:28px 4%}.ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.abox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.arow{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #eee}.arow small{display:block;color:var(--mut);margin-top:3px}.actions{display:flex;gap:5px;align-items:center}.actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px}.selectbar{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.selectbar select{padding:8px;width:min(520px,100%)}
@media(max-width:950px){.hero,.home-hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{position:sticky;top:55px;z-index:30;display:flex;flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid #ddd}.side button,.side a{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.topics{grid-template-columns:1fr}.mind{grid-template-columns:1fr}.center-node{width:170px;justify-self:center}.admin-grid{grid-template-columns:1fr}.flashgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{grid-template-columns:1fr auto}.top .mid{display:none}.grid,.mgrid,.resources,.flashgrid{grid-template-columns:1fr}.ctop,.lbar{grid-template-columns:1fr auto}.ctop .center,.lbar .t{display:none}.stats{grid-template-columns:1fr 1fr}.paper{padding:28px 20px}.hero h1{font-size:42px}}

<body><div id="root">Carregando…</div>
<script>
const URL='https://xynmjolrcuyznrhcwiwy.supabase.co',KEY='sb_publishable_dExVy88kXYDIWnn_bmPHMA_FjoNHxsR';
const db=supabase.createClient(URL,KEY),demoDb=supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false}}),root=document.getElementById('root');
const S={user:null,profile:null,courses:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const go=h=>location.hash=h;
function fail(e){console.error(e);root.innerHTML=`<main class="auth"><div class="auth-card"><div class="brand">NEXA <b>STUDY</b></div><h2>Erro ao carregar</h2><p class="err">${esc(e?.message||e)}</p><button class="btn pri" onclick="location.reload()">Tentar novamente</button></div></main>`}
async function loadPublic(){const {data,error}=await db.from('courses').select('*').eq('is_published',true).order('sort_order');if(error)throw error;S.courses=data||[]}
async function loadSession(){const {data:{user}}=await db.auth.getUser();S.user=user||null;S.profile=null;if(user){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;S.profile=data}return user}
async function route(){try{if(!S.courses.length)await loadPublic();const h=(location.hash||'#home').slice(1);if(h==='login')return login();if(h==='demo')return demoLogin();if(h==='demoapp')return demoApp();if(h==='app'){await loadSession();return app()}if(h==='admin'){await loadSession();return admin()}home()}catch(e){fail(e)}}
addEventListener('hashchange',route);
function home(){root.innerHTML=`<main class="public"><section class="hero"><div><div class="brand">NEXA <b style="color:#bfe0ff">STUDY</b></div><h1>Biomedicina em uma plataforma completa.</h1><p>Aulas por temas, mapas mentais, questões comentadas, flashcards, progresso e acesso administrativo.</p></div><div class="hero-card"><h2>Entrar na plataforma</h2><p class="muted">Use sua conta de aluno ou administrador.</p><button class="btn pri" onclick="go('login')">Entrar</button><button class="btn gh" onclick="go('demo')">Acesso teste</button></div></section></main>`}
function login(){root.innerHTML=`<main class="auth"><div class="auth-card"><div class="brand">NEXA <b>STUDY</b></div><h2>Entrar</h2><form id="lf" class="form"><label>E-mail<input id="le" type="email" required></label><label>Senha<input id="lp" type="password" required></label><button class="btn pri">Entrar</button></form><p id="lm" class="msg"></p><p><a href="#home">← voltar</a></p></div></main>`;lf.onsubmit=async ev=>{ev.preventDefault();lm.textContent='Entrando…';const {error}=await db.auth.signInWithPassword({email:le.value,password:lp.value});if(error){lm.className='msg err';lm.textContent=error.message;return}await loadSession();go(S.profile?.role==='admin'?'admin':'app')}}
function name(){return S.profile?.name||S.user?.email?.split('@')[0]||'Aluno'}
function top(){return `<header class="top"><div class="brand">NEXA <b>STUDY</b></div><div class="mid"><small>Cursando:</small><b>Biomedicina</b></div><div class="user">${esc(name())}</div></header>`}
function side(on='home'){return `<aside class="side"><button class="${on==='home'?'on':''}" data-view="home">⌂ Início</button><button class="${on==='courses'?'on':''}" data-view="courses">▤ Disciplinas</button>${S.profile?.role==='admin'?'<a href="#admin">⚙ Administração</a>':''}<span style="flex:1"></span><button id="logout">↪ Sair</button></aside>`}
function cards(list=S.courses){return list.map(c=>`<article class="card"><small>Digital • Biomedicina</small><h3>${esc(c.name)}</h3><p>${esc(c.description||'Conteúdo acadêmico completo.')}</p><button data-course="${c.id}">Acessar disciplina</button></article>`).join('')}
function homeApp(){const c=S.courses[0];return `${top()}<div class="layout">${side('home')}<main class="main"><section class="home-hero"><div><small>NEXA STUDY • BIOMEDICINA</small><h1>Bom dia, ${esc(name())}!</h1><p>Você está mais perto do seu objetivo do que imagina.</p></div><div class="mural"><h2>Mural de Avisos</h2><div class="mgrid"><article class="notice"><h3>Aulas completas</h3><p>Conteúdo organizado por temas com objetivos e aplicação biomédica.</p></article><article class="notice"><h3>Mapas mentais</h3><p>Revisão visual dos conceitos mais importantes.</p></article><article class="notice"><h3>Questões e flashcards</h3><p>Fixação ativa depois de cada aula.</p></article></div></div></section><section class="sec"><div class="sec-head"><h2>Disciplinas</h2><button class="btn gh" id="all">Acessar todas →</button></div><div class="panel">${c?`<div class="continue"><div><small>CONTINUE DE ONDE PAROU</small><h3>${esc(c.name)}</h3></div><button class="round" data-course="${c.id}">→</button></div>`:''}<div class="grid">${cards(S.courses.slice(0,6))}</div></div></section></main></div>`}
function coursesApp(){return `${top()}<div class="layout">${side('courses')}<main class="main sec"><div class="sec-head"><h2>Minhas Disciplinas</h2></div><div class="grid">${cards()}</div></main></div>`}
function bindPortal(){document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{root.innerHTML=b.dataset.view==='courses'?coursesApp():homeApp();bindPortal()});document.getElementById('all')?.addEventListener('click',()=>{root.innerHTML=coursesApp();bindPortal()});document.getElementById('logout').onclick=async()=>{await db.auth.signOut();go('home')}}
function app(){if(!S.user){go('login');return}root.innerHTML=homeApp();bindPortal()}
async function courseData(id){const [m,q,f,mm]=await Promise.all([db.from('course_modules').select('*').eq('course_id',id).eq('is_published',true).order('position'),db.from('questions').select('*').eq('course_id',id).eq('is_published',true).order('position'),db.from('flashcards').select('*').eq('course_id',id).eq('is_published',true).order('position'),db.from('mind_maps').select('*').eq('course_id',id).eq('is_published',true).order('position')]);for(const x of [m,q,f,mm])if(x.error)throw x.error;return{modules:m.data||[],questions:q.data||[],flashcards:f.data||[],maps:mm.data||[]}}
async function progress(mods){if(!S.user||!mods.length)return{};const {data,error}=await db.from('lesson_progress').select('*').in('module_id',mods.map(x=>x.id));if(error)return{};return Object.fromEntries((data||[]).map(x=>[x.module_id,x]))}
function mapVisual(c,d){const left=d.modules.filter((_,i)=>i%2===0),right=d.modules.filter((_,i)=>i%2===1),nodes=a=>a.map(m=>`<article class="node" data-lesson="${m.id}"><h4>Tema ${m.position} • ${esc(m.title)}</h4><ul>${(m.key_points||[]).slice(0,4).map(k=>`<li>${esc(k)}</li>`).join('')}</ul></article>`).join('');return `<section class="map"><span class="k">MAPA MENTAL VISUAL</span><h2>${esc(c.name)}</h2><div class="mind"><div class="col">${nodes(left)}</div><div class="center-node">${esc(c.name)}</div><div class="col">${nodes(right)}</div></div></section>`}
function courseHtml(c,d,p,demo=false){const done=d.modules.filter(m=>p[m.id]?.completed).length,pc=d.modules.length?Math.round(done*100/d.modules.length):0;return `<div class="course"><div class="ctop"><button id="back">← Voltar</button><div class="center">${esc(c.name)}</div><div class="right">${demo?'Acesso teste':pc+'% concluído'}</div></div><main class="cbody"><h1>${esc(c.name)}</h1><section class="stats"><div><b>${demo?'—':pc+'%'}</b><span>Progresso</span></div><div><b>${done}/${d.modules.length}</b><span>Conteúdos</span></div><div><b>${d.questions.length}</b><span>Exercícios</span></div><div><b>${d.maps.length}</b><span>Mapas mentais</span></div></section><section class="intro"><span class="k">APRESENTAÇÃO DA DISCIPLINA</span><h2>O que você irá estudar nesta disciplina</h2><ol>${d.modules.map(m=>`<li><b>${esc(m.title)}</b><span>${esc(m.description||'Conteúdo teórico, aplicação biomédica e revisão.')}</span></li>`).join('')}</ol></section><div class="sec-head"><h2>Temas da disciplina</h2></div><section class="topics">${d.modules.map(m=>`<article class="topic"><small>Tema ${m.position}</small><h3>${esc(m.title)}</h3><p>${esc(m.description||'')}</p><div class="topic-meta"><span>⏱ ${m.estimated_minutes||45} min</span><span>${p[m.id]?.completed?'✓ Concluído':'Disponível'}</span></div><button data-lesson="${m.id}">Acessar conteúdo</button></article>`).join('')}</section>${mapVisual(c,d)}<section class="resources"><article class="res" data-res="questions"><span>📝 FIXAÇÃO</span><strong>Questões comentadas</strong><span>${d.questions.length} questões</span></article><article class="res" data-res="flashcards"><span>🗂 MEMORIZAÇÃO</span><strong>Flashcards</strong><span>${d.flashcards.length} cartões</span></article><article class="res" data-res="map"><span>🧠 REVISÃO VISUAL</span><strong>Mapa mental</strong><span>Abrir em tela cheia</span></article></section></main></div>`}
async function openCourse(id){const c=S.courses.find(x=>x.id===id);root.innerHTML='<div style="padding:40px">Carregando disciplina…</div>';try{const d=await courseData(id),p=await progress(d.modules);renderCourse(c,d,p,false)}catch(e){fail(e)}}
function renderCourse(c,d,p,demo){root.innerHTML=courseHtml(c,d,p,demo);back.onclick=()=>demo?demoApp():(root.innerHTML=coursesApp(),bindPortal());document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>lesson(c,d,b.dataset.lesson,p,demo));document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>resource(c,d,b.dataset.res,p,demo))}
function lessonHtml(c,m,p,demo){const done=!!p[m.id]?.completed;return `<div class="lesson"><div class="lbar"><button id="lback">← Voltar</button><div class="t">Tema ${m.position} — ${esc(m.title)}</div><div class="complete">${demo?'':`<button class="btn gh" id="done">${done?'✓ Concluído':'Marcar como concluído'}</button>`}</div></div><div class="lhead">${m.position}. ${esc(m.title)}</div><main class="paper"><section class="objectives"><span class="k">ITENS INICIAIS</span><h2>Objetivos</h2><ul>${(m.objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section><h2>Introdução</h2><p>${esc(m.content||'')}</p>${(m.sections||[]).map((s,i)=>`<section class="study"><span class="k">${i+1}. ${esc(s.title||'Conteúdo')}</span><h2>${esc(s.title||'Conteúdo')}</h2><p>${esc(s.body||'')}</p></section>`).join('')}${(m.key_points||[]).length?`<aside class="call"><strong>💡 Pontos importantes para a prova</strong><ul>${m.key_points.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></aside>`:''}${m.clinical_application?`<aside class="call green"><strong>🧪 Aplicação biomédica</strong><p>${esc(m.clinical_application)}</p></aside>`:''}${m.summary?`<section class="summary"><h2>Resumo do tema</h2><p>${esc(m.summary)}</p></section>`:''}${(m.references_json||[]).length?`<section class="refs"><h3>Referências</h3>${m.references_json.map(r=>`<p><b>${esc(r.title||'Referência')}</b>${r.url?`<br>${esc(r.url)}`:''}</p>`).join('')}</section>`:''}</main></div>`}
function lesson(c,d,id,p,demo){const m=d.modules.find(x=>x.id===id);root.innerHTML=lessonHtml(c,m,p,demo);lback.onclick=()=>renderCourse(c,d,p,demo);if(!demo)done.onclick=async()=>{const completed=!p[id]?.completed;const {error}=await db.from('lesson_progress').upsert({user_id:S.user.id,module_id:id,completed,completed_at:completed?new Date().toISOString():null,updated_at:new Date().toISOString()},{onConflict:'user_id,module_id'});if(error)return alert(error.message);p=await progress(d.modules);lesson(c,d,id,p,false)}}
function resource(c,d,t,p,demo){let body=t==='map'?mapVisual(c,d):t==='questions'?`<h1>Questões comentadas</h1>${d.questions.map((q,i)=>`<article class="question"><b>${i+1}. ${esc(q.question)}</b><ol type="A">${(q.options||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ol><details><summary>Ver gabarito comentado</summary><p><b>Resposta:</b> ${esc((q.options||[])[q.correct_index]||'')}</p><p>${esc(q.explanation||'')}</p></details></article>`).join('')}`:`<h1>Flashcards</h1><div class="flashgrid">${d.flashcards.map(f=>`<article class="flash"><b>${esc(f.front)}</b><div>${esc(f.back)}</div></article>`).join('')}</div>`;root.innerHTML=`<div class="course"><div class="ctop"><button id="rback">← Voltar</button><div class="center">${esc(c.name)}</div><div></div></div><main class="rbody">${body}</main></div>`;rback.onclick=()=>renderCourse(c,d,p,demo);document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>lesson(c,d,b.dataset.lesson,p,demo))}
function demoLogin(){root.innerHTML=`<main class="auth"><div class="auth-card"><div class="brand">NEXA <b>STUDY</b></div><h2>🧪 Acesso teste</h2><form id="df" class="form"><label>Usuário<input id="du" required></label><label>Senha temporária<input id="dp" type="password" required></label><button class="btn pri">Entrar</button></form><p id="dm" class="msg"></p><p><a href="#home">← voltar</a></p></div></main>`;df.onsubmit=async ev=>{ev.preventDefault();const {data,error}=await demoDb.rpc('demo_login',{p_username:du.value.trim(),p_pin:dp.value});if(error){dm.className='msg err';dm.textContent=error.message;return}sessionStorage.setItem('nx_demo',JSON.stringify(data));go('demoapp')}}
async function demoApp(){let s;try{s=JSON.parse(sessionStorage.getItem('nx_demo')||'null')}catch{}if(!s?.token){go('demo');return}const {data,error}=await demoDb.rpc('demo_catalog',{p_token:s.token});if(error){dm?.remove?.();sessionStorage.removeItem('nx_demo');go('demo');return}root.innerHTML=`${top()}<div class="layout"><aside class="side"><button class="on">🧪 Modo teste</button><span style="flex:1"></span><button id="dout">Sair</button></aside><main class="main sec"><h2>Acesso de demonstração</h2><p class="muted">Somente leitura.</p><div class="grid">${(data||[]).map(c=>`<article class="card"><small>Digital • Biomedicina</small><h3>${esc(c.name)}</h3><p>${esc(c.description||'')}</p><button data-dcourse="${c.id}">Acessar disciplina</button></article>`).join('')}</div></main></div>`;dout.onclick=()=>{sessionStorage.removeItem('nx_demo');go('home')};document.querySelectorAll('[data-dcourse]').forEach(b=>b.onclick=()=>demoCourse(b.dataset.dcourse,s.token))}
async function demoCourse(id,token){root.innerHTML='<div style="padding:40px">Carregando…</div>';const {data,error}=await demoDb.rpc('demo_course',{p_token:token,p_course_id:id});if(error)return fail(error);renderCourse(data.course,data,{},true)}
async function admin(){if(!S.user){go('login');return}if(S.profile?.role!=='admin'){root.innerHTML='<main class="auth"><div class="auth-card"><h2>Acesso restrito</h2><a class="btn pri" href="#app">Voltar</a></div></main>';return}adminCourses()}
function adminCourses(){root.innerHTML=`<main class="admin"><div class="ahead"><div class="brand">NEXA <b>STUDY</b> • ADMIN</div><div><a class="btn gh" href="#app">Área do aluno</a> <button class="btn danger" id="aout">Sair</button></div></div><div class="admin-grid"><form id="cf" class="abox form"><input id="cid" type="hidden"><h3>Matéria</h3><label>Ícone<input id="ci" value="📘"></label><label>Nome<input id="cn" required></label><label>Descrição<textarea id="cd"></textarea></label><label>Ordem<input id="co" type="number" value="1"></label><button class="btn pri">Salvar matéria</button></form><section class="abox">${S.courses.map(c=>`<div class="arow"><div><b>${esc(c.icon||'📘')} ${esc(c.name)}</b><small>ordem ${c.sort_order}</small></div><div class="actions"><button data-editc="${c.id}">Editar</button><button class="danger" data-content="${c.id}">Conteúdos</button></div></div>`).join('')}</section></div></main>`;aout.onclick=async()=>{await db.auth.signOut();go('home')};cf.onsubmit=saveCourse;document.querySelectorAll('[data-editc]').forEach(b=>b.onclick=()=>{const c=S.courses.find(x=>x.id===b.dataset.editc);cid.value=c.id;ci.value=c.icon||'📘';cn.value=c.name;cd.value=c.description||'';co.value=c.sort_order||0});document.querySelectorAll('[data-content]').forEach(b=>b.onclick=()=>adminContent(b.dataset.content))}
async function saveCourse(ev){ev.preventDefault();const id=cid.value,p={icon:ci.value||'📘',name:cn.value.trim(),description:cd.value.trim(),sort_order:+co.value||0,modules:8,is_published:true,updated_at:new Date().toISOString()};const {error}=await(id?db.from('courses').update(p).eq('id',id):db.from('courses').insert(p));if(error)return alert(error.message);await loadPublic();adminCourses()}
async function adminContent(courseId){const c=S.courses.find(x=>x.id===courseId),d=await courseData(courseId);root.innerHTML=`<main class="admin"><div class="ahead"><div><button class="btn gh" id="ab">← Matérias</button> <b>${esc(c.name)}</b></div><a class="btn gh" href="#app">Área do aluno</a></div><div class="admin-grid"><form id="mf" class="abox form"><input id="mid" type="hidden"><h3>Aula / Tema</h3><label>Título<input id="mt" required></label><label>Descrição<textarea id="md"></textarea></label><label>Introdução<textarea id="mc"></textarea></label><label>Objetivos (um por linha)<textarea id="mo"></textarea></label><label>Pontos-chave (um por linha)<textarea id="mk"></textarea></label><label>Aplicação biomédica<textarea id="ma"></textarea></label><label>Resumo<textarea id="ms"></textarea></label><label>Ordem<input id="mp" type="number" value="1"></label><button class="btn pri">Salvar aula</button></form><section class="abox">${d.modules.map(m=>`<div class="arow"><div><b>Tema ${m.position}: ${esc(m.title)}</b><small>${esc(m.description||'')}</small></div><div class="actions"><button data-editm="${m.id}">Editar</button></div></div>`).join('')}</section></div></main>`;ab.onclick=adminCourses;document.querySelectorAll('[data-editm]').forEach(b=>b.onclick=()=>{const m=d.modules.find(x=>x.id===b.dataset.editm);mid.value=m.id;mt.value=m.title;md.value=m.description||'';mc.value=m.content||'';mo.value=(m.objectives||[]).join('\n');mk.value=(m.key_points||[]).join('\n');ma.value=m.clinical_application||'';ms.value=m.summary||'';mp.value=m.position});mf.onsubmit=async ev=>{ev.preventDefault();const id=mid.value,old=d.modules.find(x=>x.id===id),lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean),p={course_id:courseId,title:mt.value.trim(),description:md.value.trim(),content:mc.value.trim(),objectives:lines(mo.value),key_points:lines(mk.value),clinical_application:ma.value.trim(),summary:ms.value.trim(),position:+mp.value||1,is_published:true,sections:old?.sections||[],references_json:old?.references_json||[],estimated_minutes:old?.estimated_minutes||45,updated_at:new Date().toISOString()};const {error}=await(id?db.from('course_modules').update(p).eq('id',id):db.from('course_modules').insert(p));if(error)return alert(error.message);adminContent(courseId)}}
route();
</script></body></html>
